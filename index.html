<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f5c4d">
<title>تعمیرات موبایل علی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f3;--card:#fff;--ink:#17252b;--mute:#5d6f76;--line:#cfd9dc;--brand:#0f5c4d;--wait:#b7791f;--ready:#0f7b4f;--done:#6b7b82}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 Vazirmatn,Tahoma,sans-serif}
header{background:var(--brand);color:#fff;padding:22px 16px 18px}
header h1{margin:0;font-size:1.5rem;font-weight:800}
header p{margin:2px 0 0;opacity:.85;font-size:.9rem}
main{max-width:640px;margin:0 auto;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
label{display:grid;gap:4px;font-weight:600;font-size:.9rem}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #7cc6b3;outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:6px;padding:11px 16px}
.save{background:var(--brand);color:#fff}
.bar{display:flex;gap:8px;margin:22px 0 10px;align-items:center}
.bar h2{margin:0;font-size:1.1rem;flex:none}
.bar input{flex:1}
.item{background:var(--card);border:1px solid var(--line);border-right:6px solid var(--done);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.item.s-wait{border-right-color:var(--wait)}
.item.s-ready{border-right-color:var(--ready)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.name{font-weight:800}
.date{color:var(--mute);font-size:.8rem}
.meta{color:var(--mute);font-size:.9rem;margin:2px 0}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.acts select{width:auto;padding:6px 8px}
.acts a,.acts button{padding:6px 12px;font-size:.85rem;border-radius:6px;text-decoration:none}
.call{background:#e2f1ed;color:var(--brand)}
.del{background:#f7e3e0;color:#9b2c1f}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
.total{color:var(--mute);font-size:.85rem;flex:1}
.tools{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.tool{background:#e2f1ed;color:var(--brand);padding:6px 12px;font-size:.85rem}
</style>
</head>
<body>
<header>
  <h1>تعمیرات موبایل علی</h1>
  <p>ثبت و پیگیری مشتری‌ها</p>
</header>
<main>
  <form id="f">
    <div class="row">
      <label>نام مشتری<input id="name" required></label>
      <label>شماره تماس<input id="phone" type="tel" inputmode="tel" required></label>
    </div>
    <div class="row">
      <label>مدل گوشی<input id="model" required></label>
      <label>هزینه (تومان)<input id="cost" type="number" inputmode="numeric" min="0"></label>
    </div>
    <label>مشکل دستگاه<textarea id="issue" rows="2" required></textarea></label>
    <label>وضعیت
      <select id="status">
        <option value="wait">در حال تعمیر</option>
        <option value="ready">آماده تحویل</option>
        <option value="done">تحویل شد</option>
      </select>
    </label>
    <button class="save" type="submit">ثبت مشتری</button>
  </form>

  <div class="bar">
    <h2>مشتری‌ها</h2>
    <input id="q" type="search" placeholder="جستجو با نام، شماره یا مدل">
  </div>
  <div class="tools">
    <span class="total" id="total"></span>
    <button type="button" class="tool" id="exp">دانلود پشتیبان</button>
    <button type="button" class="tool" id="imp">بازیابی پشتیبان</button>
    <input type="file" id="file" accept=".json" hidden>
  </div>
  <div id="list"></div>
</main>

<script>
var KEY = 'repair-customers';
var LABELS = {wait: 'در حال تعمیر', ready: 'آماده تحویل', done: 'تحویل شد'};
var data = [];

function load() {
  try { data = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { data = []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { alert('ذخیره‌سازی در این مرورگر ممکن نیست.'); }
}
function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function render() {
  var q = document.getElementById('q').value.trim().toLowerCase();
  var list = document.getElementById('list');
  list.textContent = '';
  var shown = data.filter(function (c) {
    return !q || (c.name + ' ' + c.phone + ' ' + c.model).toLowerCase().indexOf(q) > -1;
  });
  document.getElementById('total').textContent = data.length + ' مشتری ثبت شده';
  if (!shown.length) {
    list.appendChild(el('div', 'empty', data.length ? 'موردی پیدا نشد.' : 'هنوز مشتری ثبت نشده. فرم بالا را پر کن.'));
    return;
  }
  shown.slice().reverse().forEach(function (c) {
    var box = el('div', 'item s-' + c.status);
    var top = el('div', 'top');
    top.appendChild(el('span', 'name', c.name));
    top.appendChild(el('span', 'date', new Date(c.id).toLocaleDateString('fa-IR')));
    box.appendChild(top);
    box.appendChild(el('div', 'meta', c.model + ' - ' + c.issue));
    box.appendChild(el('div', 'meta', 'هزینه: ' + (c.cost ? Number(c.cost).toLocaleString('fa-IR') + ' تومان' : 'مشخص نشده')));

    var acts = el('div', 'acts');
    var sel = document.createElement('select');
    Object.keys(LABELS).forEach(function (k) {
      var o = el('option', '', LABELS[k]);
      o.value = k;
      if (k === c.status) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = function () { c.status = sel.value; save(); render(); };
    acts.appendChild(sel);

    var call = el('a', 'call', 'تماس');
    call.href = 'tel:' + c.phone.replace(/[^\d+]/g, '');
    acts.appendChild(call);

    var del = el('button', 'del', 'حذف');
    del.type = 'button';
    del.onclick = function () {
      if (confirm('«' + c.name + '» حذف شود؟')) {
        data = data.filter(function (x) { return x.id !== c.id; });
        save(); render();
      }
    };
    acts.appendChild(del);
    box.appendChild(acts);
    list.appendChild(box);
  });
}

document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var v = function (id) { return document.getElementById(id).value.trim(); };
  data.push({
    id: Date.now(),
    name: v('name'), phone: v('phone'), model: v('model'),
    issue: v('issue'), cost: v('cost'), status: v('status')
  });
  save();
  e.target.reset();
  render();
});
document.getElementById('q').addEventListener('input', render);
document.getElementById('exp').onclick = function () {
  var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ali-repair-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById('imp').onclick = function () { document.getElementById('file').click(); };
document.getElementById('file').onchange = function (e) {
  var f = e.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var arr = JSON.parse(r.result);
      if (!Array.isArray(arr)) throw 0;
      if (confirm('اطلاعات فعلی با فایل پشتیبان جایگزین شود؟')) { data = arr; save(); render(); }
    } catch (err) { alert('فایل پشتیبان معتبر نیست.'); }
  };
  r.readAsText(f);
  e.target.value = '';
};

load();
render();
</script>
</body>
</html>
